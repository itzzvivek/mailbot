version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mailbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mailbot.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mailbot-network

  bot:
    build: .
    container_name: mailbot-bot
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mailbot-network
    volumes:
      - .:/app
      - ./logs:/app/logs

volumes:
  postgres_data:

networks:
  mailbot-network:
    driver: bridge